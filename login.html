<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AuditAI Login – Secure Role-Based Access for Employee, Manager, Auditor, and Admin portals.">
  <title>Login – AuditAI Platform</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="style.css">

  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.12) 0%, rgba(9, 13, 22, 1) 70%);
    }
    .login-card {
      width: 100%;
      max-width: 450px;
      padding: 38px 32px;
      position: relative;
      z-index: 2;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 30px rgba(59, 130, 246, 0.1);
    }
    .demo-accounts-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color, rgba(255, 255, 255, 0.08));
    }
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .demo-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
      color: #94a3b8;
      font-size: 0.78rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .demo-btn strong {
      color: #f1f5f9;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .demo-btn:hover {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      transform: translateY(-2px);
    }
    .academic-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #c4b5fd;
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <!-- Loading Bar Indicator -->
  <div id="global-loader"></div>

  <div class="login-container">
    <div class="hero-glow-blob hero-glow-1"></div>
    <div class="hero-glow-blob hero-glow-2"></div>

    <div class="glass-panel login-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <div class="academic-pill">
          <i class="fa-solid fa-graduation-cap"></i>
          <span>Soft Computing Lab • SIT Nagpur</span>
        </div>
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 10px;">
          <div class="brand-icon-box">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <span>Audit<span class="text-gradient">AI</span></span>
        </a>
        <h2 style="font-size: 1.45rem; font-weight: 700; margin-bottom: 4px; color: #f8fafc;">Sign In to Portal</h2>
        <p class="text-muted text-sm" style="font-size: 0.84rem; color: #94a3b8;">Role-Based Access Control & Real-Time Fraud Defense</p>
      </div>

      <form id="login-form">
        <div class="form-group" style="margin-bottom: 16px;">
          <label for="login-email" style="display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; color: #cbd5e1;">Email Address</label>
          <div style="position: relative;">
            <input type="email" id="login-email" class="form-control" placeholder="e.g. auditor@auditai.com" required style="padding-left: 38px; width: 100%; height: 42px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; color: #f8fafc; font-size: 0.88rem;">
            <i class="fa-solid fa-envelope text-muted" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 0.85rem; color: #64748b;"></i>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 22px;">
          <label for="login-password" style="display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; color: #cbd5e1;">Password</label>
          <div style="position: relative;">
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required style="padding-left: 38px; width: 100%; height: 42px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; color: #f8fafc; font-size: 0.88rem;">
            <i class="fa-solid fa-lock text-muted" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 0.85rem; color: #64748b;"></i>
          </div>
        </div>

        <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: 600; font-size: 0.95rem; border-radius: 8px;">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Sign In</span>
        </button>
      </form>

      <!-- Demo Accounts 1-Click Fill -->
      <div class="demo-accounts-box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span class="text-xs text-muted uppercase font-semibold" style="font-size: 0.72rem; letter-spacing: 0.5px; color: #94a3b8;">1-Click Demo Accounts (Demo@123):</span>
          <span class="brand-badge" style="font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; background: rgba(59,130,246,0.2); color: #60a5fa;">Auto-Fill</span>
        </div>

        <div class="demo-grid">
          <button type="button" class="demo-btn" data-email="employee@auditai.com" data-role="employee">
            <strong><i class="fa-solid fa-user-pen" style="color: #60a5fa;"></i> Employee</strong>
            <span>Sarah (Submit & Receipts)</span>
          </button>
          <button type="button" class="demo-btn" data-email="manager@auditai.com" data-role="manager">
            <strong><i class="fa-solid fa-user-check" style="color: #34d399;"></i> Manager</strong>
            <span>David (1st-Level Review)</span>
          </button>
          <button type="button" class="demo-btn" data-email="auditor@auditai.com" data-role="auditor">
            <strong><i class="fa-solid fa-user-shield" style="color: #a78bfa;"></i> Auditor</strong>
            <span>Alex (Full Risk & AI)</span>
          </button>
          <button type="button" class="demo-btn" data-email="admin@auditai.com" data-role="admin">
            <strong><i class="fa-solid fa-user-gear" style="color: #f87171;"></i> Admin</strong>
            <span>Marcus (Budgets & Ops)</span>
          </button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 22px;">
        <a href="index.html" class="text-xs text-muted" style="text-decoration: none; color: #94a3b8; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 6px;">
          <i class="fa-solid fa-arrow-left"></i> Back to Landing Page
        </a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to dashboard
      const existingToken = localStorage.getItem('auditai_token');
      if (existingToken) {
        window.location.href = 'dashboard.html';
        return;
      }

      // 1-Click Demo Accounts
      document.querySelectorAll('.demo-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('login-email').value = btn.dataset.email;
          document.getElementById('login-password').value = 'Demo@123';
          if (typeof showToast === 'function') {
            showToast(`Loaded ${btn.dataset.role.toUpperCase()} credentials (Demo@123)`, 'info', 2000);
          }
        });
      });

      // Handle Login Submit
      const form = document.getElementById('login-form');
      const submitBtn = document.getElementById('btn-login-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

        try {
          const res = await API.login(email, password);
          if (typeof showToast === 'function') {
            showToast(`Welcome back, ${res.user.name} (${res.user.role.toUpperCase()})!`, 'success');
          }
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 600);
        } catch (err) {
          if (typeof showToast === 'function') {
            showToast(err.message || 'Login failed. Please check credentials.', 'error');
          } else {
            alert(err.message || 'Login failed.');
          }
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> <span>Sign In</span>';
        }
      });
    });
  </script>
</body>
</html>
